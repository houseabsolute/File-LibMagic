name: Run tests

on:
  - pull_request
  - push

jobs:
  ci:
    uses: houseabsolute/workflow-perl-dzil-ci/.github/workflows/ci.yml@v0
    with:
      dist: File-LibMagic
      with-threads: true
      ref: v0
      additional-modules: Config::AutoConf
      # This dist is a binding for libmagic, so it cannot build without the
      # headers. There is no reasonable way to get libmagic on Windows, which
      # is why this dist never had a Windows stage under Azure either.
      apt-packages: libmagic-dev
      brew-packages: libmagic
      with-windows: false
